# Backend defaults preserve Codex Luna Max; the explicit final-reviewer model is retained.
# Human decisions and evidence guards are verified by the runtime, not worker conclusions.
id: development-flow-v1
version: 1.2.0
description: Development with durable acceptance, same-owner incremental
  reviews, exact human plan approval, conditional integration, controlled
  validation, optional UAT, and verified closure.
initial_step: context
policy:
  strict: true
  plan_artifact: plan
preferences:
  review_mode:
    values:
      - loop
      - single_review
  uat_preference:
    values:
      - prepare
      - skip
state:
  planner_approved: false
  uat_completed: false
  validation_mode: complete_gate
prompts:
  role_analyst:
    path: roles/analyst.md
  role_planner:
    path: roles/planner.md
  role_implementer:
    path: roles/implementer.md
  role_validator:
    path: roles/validator.md
  role_final_reviewer:
    path: roles/final-reviewer.md
  step_context:
    path: prompts/context.md
  step_analysis:
    path: prompts/analysis.md
  step_planning:
    path: prompts/planning.md
  step_plan_review:
    path: prompts/plan-review.md
  step_implementation:
    path: prompts/implementation.md
  step_integration:
    path: prompts/integration.md
  step_validation:
    path: prompts/validation.md
  step_implementation_review:
    path: prompts/implementation-review.md
  step_uat_preparation:
    path: prompts/uat-preparation.md
  step_final_review:
    path: prompts/final-review.md
roles:
  analyst:
    backend: ${DEVFLOW_ANALYST_BACKEND:-codex-thread}
    model: ${DEVFLOW_ANALYST_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_ANALYST_REASONING_EFFORT-max}
    agent_lifecycle: reuse
    prompt_ref: role_analyst
  planner:
    backend: ${DEVFLOW_PLANNER_BACKEND:-codex-thread}
    model: ${DEVFLOW_PLANNER_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_PLANNER_REASONING_EFFORT-max}
    agent_lifecycle: reuse
    prompt_ref: role_planner
  implementer:
    backend: ${DEVFLOW_IMPLEMENTER_BACKEND:-codex-thread}
    model: ${DEVFLOW_IMPLEMENTER_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_IMPLEMENTER_REASONING_EFFORT-max}
    agent_lifecycle: reuse
    prompt_ref: role_implementer
  validator:
    backend: ${DEVFLOW_VALIDATOR_BACKEND:-codex-thread}
    model: ${DEVFLOW_VALIDATOR_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_VALIDATOR_REASONING_EFFORT-max}
    agent_lifecycle: reuse
    prompt_ref: role_validator
  final_reviewer:
    backend: ${DEVFLOW_FINAL_REVIEWER_BACKEND:-codex-thread}
    model: ${DEVFLOW_FINAL_REVIEWER_MODEL-gpt-5.5}
    agent_lifecycle: reuse
    prompt_ref: role_final_reviewer
  orchestrator:
    description: Original clarification owner and recorded human decisions; no
      delegated worker.
artifacts:
  context:
    path: "{run_dir}/context.md"
  analysis:
    path: "{run_dir}/analysis.md"
  plan:
    path: "{run_dir}/plan.md"
  uat_guide:
    path: "{run_dir}/uat-guide.md"
steps:
  context:
    role: analyst
    prompt_ref: step_context
    description: Discover task-relevant repository facts; the same analyst later
      synthesizes Analysis.
    outputs:
      context:
        artifact: context
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - ready
              - needs_clarification
              - blocked
    on:
      reported:
        transitions:
          - id: context-ready
            when:
              equals:
                var: result.conclusion
                value: ready
            to: analysis
          - id: context-clarification
            when:
              equals:
                var: result.conclusion
                value: needs_clarification
            notify: orchestrator
          - id: context-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    sandbox: workspace
    evidence_operations:
      - read_receipt
  analysis:
    role: analyst
    prompt_ref: step_analysis
    description: Synthesize solution intent from Context and the current acceptance
      revision.
    inputs:
      context:
        artifact: context
        required: true
    outputs:
      analysis:
        artifact: analysis
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - ready
              - needs_clarification
              - blocked
    on:
      reported:
        transitions:
          - id: analysis-ready
            when:
              equals:
                var: result.conclusion
                value: ready
            to: analysis_intent
          - id: analysis-clarification
            when:
              equals:
                var: result.conclusion
                value: needs_clarification
            notify: orchestrator
          - id: analysis-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    sandbox: workspace
    evidence_operations:
      - read_receipt
  analysis_intent:
    role: orchestrator
    execution: coordinator
    decision:
      key: analysis_intent
      artifact_key: analysis
      authority: coordinator
    report:
      schema:
        type: object
        required:
          - decision
        properties:
          decision:
            enum:
              - approved
              - changes_required
              - blocked
    on:
      reported:
        transitions:
          - id: intent-approved
            when:
              equals:
                var: result.decision
                value: approved
            to: planning
          - id: intent-correction
            when:
              equals:
                var: result.decision
                value: changes_required
            to: analysis
          - id: intent-blocked
            when:
              equals:
                var: result.decision
                value: blocked
            notify: orchestrator
    inputs:
      analysis:
        artifact: analysis
        required: true
    description: The original clarification owner checks Analysis only for
      preservation of user intent.
    evidence_operations:
      - read_receipt
  planning:
    role: planner
    prompt_ref: step_planning
    description: Write stable work packages, dependencies, complete affected checks,
      and integration boundaries.
    requires:
      equals:
        var: decisions.analysis_intent.value
        value: approved
    inputs:
      analysis:
        artifact: analysis
        required: true
    outputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - ready
              - needs_analysis_revision
              - blocked
    on:
      reported:
        transitions:
          - id: plan-ready
            when:
              equals:
                var: result.conclusion
                value: ready
            to: plan_review
          - id: plan-analysis-correction
            when:
              equals:
                var: result.conclusion
                value: needs_analysis_revision
            to: analysis
          - id: plan-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    sandbox: workspace
    evidence_operations:
      - read_receipt
  plan_review:
    role: analyst
    prompt_ref: step_plan_review
    description: The exact analyst reviews the plan and records a strict incremental
      receipt.
    inputs:
      analysis:
        artifact: analysis
        required: true
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - approved
              - needs_plan_changes
              - analysis_revision_needed
              - blocked
          evidence_receipt_id:
            type: string
    on:
      reported:
        transitions:
          - id: plan-intent-approved
            when:
              equals:
                var: result.conclusion
                value: approved
            to: plan_approval
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: plan_review
                require_current: true
                require_approved: true
                owner_role: analyst
          - id: plan-intent-correction
            when:
              equals:
                var: result.conclusion
                value: needs_plan_changes
            to: planning
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: plan_review
                require_current: true
                require_approved: false
                owner_role: analyst
          - id: plan-intent-analysis-correction
            when:
              equals:
                var: result.conclusion
                value: analysis_revision_needed
            to: analysis
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: plan_review
                require_current: true
                require_approved: false
                owner_role: analyst
          - id: plan-intent-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - prepare_plan
      - diff_plan
      - record_plan_review
    sandbox: read_only
  plan_approval:
    role: orchestrator
    execution: coordinator
    decision:
      key: plan_approval
      artifact_key: plan
      authority: user
    report:
      schema:
        type: object
        required:
          - decision
        properties:
          decision:
            enum:
              - approved
              - changes_required
              - blocked
    on:
      reported:
        transitions:
          - id: human-plan-approved
            when:
              equals:
                var: result.decision
                value: approved
            to: implementation
          - id: human-plan-correction
            when:
              equals:
                var: result.decision
                value: changes_required
            to: planning
          - id: human-plan-blocked
            when:
              equals:
                var: result.decision
                value: blocked
            notify: orchestrator
    inputs:
      plan:
        artifact: plan
        required: true
    requires_evidence:
      - receipt: evidence.plan_review
        kind: plan_review
        require_current: true
        require_approved: true
        owner_role: analyst
    description: Record explicit user approval of the exact current plan; unchanged
      valid approval can be reused.
    evidence_operations:
      - read_receipt
  implementation:
    role: implementer
    prompt_ref: step_implementation
    description: Execute user-approved packages and report whether consolidation is needed.
    requires:
      equals:
        var: decisions.plan_approval.value
        value: approved
    requires_evidence:
      - receipt: evidence.plan_review
        kind: plan_review
        require_current: true
        require_approved: true
        owner_role: analyst
    inputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
          - integration_needed
        properties:
          conclusion:
            enum:
              - ready
              - needs_plan_revision
              - blocked
          integration_needed:
            type: boolean
    on:
      reported:
        transitions:
          - id: implementation-needs-integration
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: ready
                - equals:
                    var: result.integration_needed
                    value: true
            to: integration
          - id: implementation-focused-check
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: ready
                - equals:
                    var: result.integration_needed
                    value: false
                - equals:
                    var: state.validation_mode
                    value: focused_recheck
            to: focused_validation
          - id: implementation-complete-check
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: ready
                - equals:
                    var: result.integration_needed
                    value: false
                - equals:
                    var: state.validation_mode
                    value: complete_gate
            to: validation
          - id: implementation-plan-correction
            when:
              equals:
                var: result.conclusion
                value: needs_plan_revision
            to: planning
          - id: implementation-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - project_plan
    sandbox: workspace
  integration:
    role: implementer
    prompt_ref: step_integration
    description: Consolidate all required package outputs only when multiple outputs
      need integration.
    requires:
      equals:
        var: decisions.plan_approval.value
        value: approved
    inputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - ready
              - needs_plan_revision
              - blocked
    on:
      reported:
        transitions:
          - id: integration-focused-check
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: ready
                - equals:
                    var: state.validation_mode
                    value: focused_recheck
            to: focused_validation
          - id: integration-complete-check
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: ready
                - equals:
                    var: state.validation_mode
                    value: complete_gate
            to: validation
          - id: integration-plan-correction
            when:
              equals:
                var: result.conclusion
                value: needs_plan_revision
            to: planning
          - id: integration-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - project_plan
    sandbox: workspace
  focused_validation:
    role: validator
    prompt_ref: step_validation
    description: No-edit focused recheck of the known correction bundle; never
      sufficient for closure.
    requires:
      equals:
        var: decisions.plan_approval.value
        value: approved
    inputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - passed
              - failed
              - blocked
          evidence_receipt_id:
            type: string
    on:
      reported:
        transitions:
          - id: focused-ready-for-complete
            when:
              equals:
                var: result.conclusion
                value: passed
            to: validation
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: true
                owner_role: validator
                validation_mode: focused
          - id: focused-correction
            when:
              equals:
                var: result.conclusion
                value: failed
            to: implementation
            set:
              validation_mode: focused_recheck
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: false
                owner_role: validator
                validation_mode: focused
          - id: focused-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - prepare_result
      - validation_run
    sandbox: read_only
  validation:
    role: validator
    prompt_ref: step_validation
    description: No-edit complete affected gate with actual or conservatively reused
      execution receipts.
    requires:
      equals:
        var: decisions.plan_approval.value
        value: approved
    inputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - passed
              - failed
              - blocked
          evidence_receipt_id:
            type: string
    on:
      reported:
        transitions:
          - id: validated-first-planner
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: passed
                - equals:
                    var: state.planner_approved
                    value: false
            to: implementation_review
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: true
                owner_role: validator
                validation_mode: complete_gate
          - id: validated-back-to-expert
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: passed
                - equals:
                    var: state.planner_approved
                    value: true
                - equals:
                    var: state.uat_completed
                    value: true
            to: final_review
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: true
                owner_role: validator
                validation_mode: complete_gate
          - id: validated-back-to-uat
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: passed
                - equals:
                    var: state.planner_approved
                    value: true
                - equals:
                    var: state.uat_completed
                    value: false
                - equals:
                    var: decisions.uat_preference.value
                    value: prepare
            to: uat_preparation
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: true
                owner_role: validator
                validation_mode: complete_gate
          - id: validated-uat-decision
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: passed
                - equals:
                    var: state.planner_approved
                    value: true
                - equals:
                    var: state.uat_completed
                    value: false
            to: uat_decision
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: true
                owner_role: validator
                validation_mode: complete_gate
          - id: validation-correction
            when:
              equals:
                var: result.conclusion
                value: failed
            to: implementation
            set:
              validation_mode: focused_recheck
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: validation
                require_current: true
                require_approved: false
                owner_role: validator
                validation_mode: complete_gate
          - id: validation-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - prepare_result
      - validation_run
    sandbox: read_only
  implementation_review:
    role: planner
    prompt_ref: step_implementation_review
    description: The exact planner validates conformance until its first strict approval.
    requires:
      equals:
        var: decisions.plan_approval.value
        value: approved
    requires_evidence:
      - receipt: evidence.validation
        kind: validation
        require_current: true
        require_approved: true
        owner_role: validator
        validation_mode: complete_gate
    inputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - approved
              - implementation_changes_needed
              - plan_revision_needed
              - blocked
          evidence_receipt_id:
            type: string
    on:
      reported:
        transitions:
          - id: planner-first-approval
            when:
              equals:
                var: result.conclusion
                value: approved
            to: uat_decision
            set:
              planner_approved: true
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: planner_review
                require_current: true
                require_approved: true
                owner_role: planner
          - id: planner-code-correction
            when:
              equals:
                var: result.conclusion
                value: implementation_changes_needed
            to: implementation
            set:
              validation_mode: focused_recheck
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: planner_review
                require_current: true
                require_approved: false
                owner_role: planner
          - id: planner-plan-correction
            when:
              equals:
                var: result.conclusion
                value: plan_revision_needed
            to: planning
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: planner_review
                require_current: true
                require_approved: false
                owner_role: planner
          - id: planner-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - prepare_result
      - diff_result
      - record_review
      - review_scope
    evidence_gates:
      - planner
    sandbox: read_only
  uat_decision:
    role: orchestrator
    execution: coordinator
    decision:
      key: uat_preference
      authority: user
    report:
      schema:
        type: object
        required:
          - decision
        properties:
          decision:
            enum:
              - prepare
              - skip
              - blocked
    on:
      reported:
        transitions:
          - id: uat-selected
            when:
              equals:
                var: result.decision
                value: prepare
            to: uat_preparation
          - id: uat-skipped
            when:
              equals:
                var: result.decision
                value: skip
            to: final_review
            set:
              uat_completed: true
          - id: uat-choice-blocked
            when:
              equals:
                var: result.decision
                value: blocked
            notify: orchestrator
    requires:
      equals:
        var: state.planner_approved
        value: true
    description: Apply the recorded user preference, or ask once whether to prepare
      optional UAT or proceed.
    evidence_operations:
      - read_receipt
  uat_preparation:
    role: implementer
    prompt_ref: step_uat_preparation
    description: Prepare the selected UAT experience without editing product code or
      claiming user approval.
    requires:
      equals:
        var: decisions.uat_preference.value
        value: prepare
    requires_evidence:
      - receipt: evidence.validation
        kind: validation
        require_current: true
        require_approved: true
        owner_role: validator
        validation_mode: complete_gate
    inputs:
      plan:
        artifact: plan
        required: true
    outputs:
      uat_guide:
        artifact: uat_guide
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - ready
              - implementation_changes_needed
              - blocked
    on:
      reported:
        transitions:
          - id: uat-ready
            when:
              equals:
                var: result.conclusion
                value: ready
            to: uat_review
          - id: uat-setup-correction
            when:
              equals:
                var: result.conclusion
                value: implementation_changes_needed
            to: implementation
            set:
              validation_mode: focused_recheck
          - id: uat-setup-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    sandbox: workspace
    evidence_operations:
      - read_receipt
  uat_review:
    role: orchestrator
    execution: coordinator
    decision:
      key: uat_result
      authority: user
    report:
      schema:
        type: object
        required:
          - decision
        properties:
          decision:
            enum:
              - approved
              - changes_required
              - skip
              - blocked
    on:
      reported:
        transitions:
          - id: uat-accepted
            when:
              equals:
                var: result.decision
                value: approved
            to: final_review
            set:
              uat_completed: true
          - id: uat-user-skipped
            when:
              equals:
                var: result.decision
                value: skip
            to: final_review
            set:
              uat_completed: true
          - id: uat-user-correction
            when:
              equals:
                var: result.decision
                value: changes_required
            to: implementation
            set:
              validation_mode: focused_recheck
              uat_completed: false
          - id: uat-result-blocked
            when:
              equals:
                var: result.decision
                value: blocked
            notify: orchestrator
    requires:
      equals:
        var: decisions.uat_preference.value
        value: prepare
    description: Wait for the user’s UAT observations; never infer acceptance from
      preparation or elapsed time.
    evidence_operations:
      - read_receipt
  final_review:
    role: final_reviewer
    prompt_ref: step_final_review
    description: One independent expert owns the complete first review and every
      incremental correction review.
    requires:
      all:
        - equals:
            var: decisions.plan_approval.value
            value: approved
        - equals:
            var: state.planner_approved
            value: true
        - equals:
            var: state.uat_completed
            value: true
    requires_evidence:
      - receipt: evidence.validation
        kind: validation
        require_current: true
        require_approved: true
        owner_role: validator
        validation_mode: complete_gate
    inputs:
      plan:
        artifact: plan
        required: true
    report:
      schema:
        type: object
        required:
          - conclusion
          - target_phase
        properties:
          conclusion:
            enum:
              - approved
              - changes_required
              - blocked
          target_phase:
            enum:
              - done
              - analysis
              - planning
              - implementation
              - final_review
              - orchestrator
          evidence_receipt_id:
            type: string
    on:
      reported:
        transitions:
          - id: expert-approved
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: approved
                - equals:
                    var: result.target_phase
                    value: done
            to: closure
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: true
                owner_role: final_reviewer
          - id: expert-single-review
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: changes_required
                - equals:
                    var: decisions.review_mode.value
                    value: single_review
            notify: orchestrator
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: false
                owner_role: final_reviewer
          - id: expert-to-analysis
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: changes_required
                - equals:
                    var: result.target_phase
                    value: analysis
            to: analysis
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: false
                owner_role: final_reviewer
          - id: expert-to-planning
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: changes_required
                - equals:
                    var: result.target_phase
                    value: planning
            to: planning
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: false
                owner_role: final_reviewer
          - id: expert-to-implementation
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: changes_required
                - equals:
                    var: result.target_phase
                    value: implementation
            to: implementation
            set:
              validation_mode: focused_recheck
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: false
                owner_role: final_reviewer
          - id: expert-to-final_review
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: changes_required
                - equals:
                    var: result.target_phase
                    value: final_review
            to: final_review
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: false
                owner_role: final_reviewer
          - id: expert-human-decision
            when:
              all:
                - equals:
                    var: result.conclusion
                    value: changes_required
                - equals:
                    var: result.target_phase
                    value: orchestrator
            notify: orchestrator
            requires_evidence:
              - receipt: result.evidence_receipt_id
                kind: expert_review
                require_current: true
                require_approved: false
                owner_role: final_reviewer
          - id: expert-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - prepare_result
      - diff_result
      - record_review
    evidence_gates:
      - expert
    sandbox: read_only
  closure:
    role: orchestrator
    execution: coordinator
    description: Verify strict expert and complete GREEN mechanical evidence against
      the unchanged current result, then close.
    requires:
      all:
        - equals:
            var: decisions.plan_approval.value
            value: approved
        - equals:
            var: state.planner_approved
            value: true
        - equals:
            var: state.uat_completed
            value: true
    requires_evidence:
      - receipt: evidence.final_review
        kind: expert_review
        require_current: true
        require_approved: true
        owner_role: final_reviewer
      - receipt: evidence.validation
        kind: validation
        require_current: true
        require_approved: true
        owner_role: validator
        validation_mode: complete_gate
    report:
      schema:
        type: object
        required:
          - conclusion
        properties:
          conclusion:
            enum:
              - verified
              - blocked
    on:
      reported:
        transitions:
          - id: verified-closure
            when:
              equals:
                var: result.conclusion
                value: verified
            finish: true
            requires_evidence:
              - receipt: evidence.closure
                kind: closure
                require_current: true
                require_approved: true
          - id: closure-blocked
            when:
              equals:
                var: result.conclusion
                value: blocked
            notify: orchestrator
    evidence_operations:
      - read_receipt
      - verify_closure
