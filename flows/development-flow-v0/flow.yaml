# Agent Control flow config. Environment placeholders use ${VAR:-default} and are resolved by agentctl.

id: development-flow
version: 0.1.1
description: Orchestrator-driven development workflow with stable phase owners, artifact handoffs,
  implementation-owned mechanical checks, and one persistent independent expert-review loop at the end.
initial_step: analysis
prompts:
  role_analyst:
    path: roles/analyst.md
    description: Stable analyst role behavior.
  role_planner:
    path: roles/planner.md
    description: Stable planner role behavior.
  role_implementer:
    path: roles/implementer.md
    description: Stable implementer role behavior.
  role_final_reviewer:
    path: roles/final-reviewer.md
    description: Stable final reviewer role behavior.
  step_analysis:
    path: prompts/analysis.md
    description: Analysis phase instructions.
  step_planning:
    path: prompts/planning.md
    description: Planning phase instructions.
  step_intent_review:
    path: prompts/intent-review.md
    description: Intent-preservation review instructions.
  step_implementation:
    path: prompts/implementation.md
    description: Implementation phase instructions.
  step_final_review:
    path: prompts/final-review.md
    description: Final independent review-loop instructions.
roles:
  analyst:
    backend: ${DEVFLOW_ANALYST_BACKEND:-codex-thread}
    model: ${DEVFLOW_ANALYST_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_ANALYST_REASONING_EFFORT-max}
    prompt_ref: role_analyst
    description: Understands the task and repository context, then writes analysis or correction-focused
      analysis.
  planner:
    backend: ${DEVFLOW_PLANNER_BACKEND:-codex-thread}
    model: ${DEVFLOW_PLANNER_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_PLANNER_REASONING_EFFORT-max}
    prompt_ref: role_planner
    description: Turns analysis into a worker-ready implementation plan and reviews implementation
      intent preservation.
  implementer:
    backend: ${DEVFLOW_IMPLEMENTER_BACKEND:-codex-thread}
    model: ${DEVFLOW_IMPLEMENTER_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_IMPLEMENTER_REASONING_EFFORT-max}
    prompt_ref: role_implementer
    description: Implements the plan, performs mechanical checks, fixes failures, and writes one
      coherent report.
  final_reviewer:
    backend: ${DEVFLOW_FINAL_REVIEWER_BACKEND:-codex-thread}
    model: ${DEVFLOW_FINAL_REVIEWER_MODEL-gpt-5.6-luna}
    reasoning_effort: ${DEVFLOW_FINAL_REVIEWER_REASONING_EFFORT-max}
    agent_lifecycle: reuse
    prompt_ref: role_final_reviewer
    description: Clean-context reviewer created on first entry and reused for every final-review iteration.
  orchestrator:
    description: Coordinates routing, user confirmation, retries, rollbacks, and final synthesis.
artifacts:
  analysis:
    path: "{run_dir}/analysis.md"
    description: Analysis or correction-focused analysis produced by the analyst.
  plan:
    path: "{run_dir}/plan.md"
    description: Implementation plan produced by the planner.
  plan_review:
    path: "{run_dir}/plan-review.md"
    description: Analyst intent-preservation review of the plan.
  implementation_report:
    path: "{run_dir}/implementation-report.md"
    description: Implementer report covering changed files, mechanical checks, fixes, and blockers.
  implementation_review:
    path: "{run_dir}/implementation-review.md"
    description: Planner intent-preservation review of implementation against plan.
  final_review:
    path: "{run_dir}/final-review.md"
    description: Independent external expert review updated by the same reviewer across iterations.
steps:
  analysis:
    role: analyst
    prompt_ref: step_analysis
    outputs:
      analysis:
        artifact: analysis
        required: true
    on:
      reported:
        notify: orchestrator
  planning:
    role: planner
    prompt_ref: step_planning
    inputs:
      analysis:
        artifact: analysis
        required: true
    outputs:
      plan:
        artifact: plan
        required: true
    on:
      reported:
        notify: orchestrator
  plan_review:
    role: analyst
    prompt_ref: step_intent_review
    inputs:
      analysis:
        artifact: analysis
        required: true
      plan:
        artifact: plan
        required: true
    outputs:
      plan_review:
        artifact: plan_review
        required: true
    on:
      reported:
        notify: orchestrator
  implementation:
    role: implementer
    prompt_ref: step_implementation
    inputs:
      plan:
        artifact: plan
        required: true
    outputs:
      implementation_report:
        artifact: implementation_report
        required: true
    on:
      reported:
        notify: orchestrator
  implementation_review:
    role: planner
    prompt_ref: step_intent_review
    inputs:
      plan:
        artifact: plan
        required: true
      implementation_report:
        artifact: implementation_report
        required: true
    outputs:
      implementation_review:
        artifact: implementation_review
        required: true
    on:
      reported:
        notify: orchestrator
  final_review:
    role: final_reviewer
    prompt_ref: step_final_review
    inputs:
      plan:
        artifact: plan
        required: true
    outputs:
      final_review:
        artifact: final_review
        required: true
    on:
      reported:
        notify: orchestrator
